<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | Green Mangrove Nusantara Library</title>

  <link rel="stylesheet" href="style.css">

  <!-- FONT -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

<!-- HEADER -->
<header>
  <div class="logo">🌿 Green Mangrove Nusantara Library</div>
  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About Us</a>
    <a href="greencorner.html">Green Corner</a>
    <a href="pages/collection.html">Collection</a>
    <a href="contact.html">Contact Us</a>
    <a href="sign-in.html" class="signin-btn">Sign In</a>
  </nav>
</header>

<!-- BACK BUTTON -->
<div class="gsys-back-wrap">
  <a href="javascript:history.back()" class="gsys-back-btn">← Back</a>
</div>

<!-- CONTACT SECTION -->
<section class="gctc-contact-section">
  <div class="gctc-contact-box">

    <h1 class="gctc-title">Contact Us</h1>
    <p class="gctc-subtitle">Berikan masukan, saran, atau kritik untuk pengembangan website kami 🌿</p>

    <form class="gctc-form">

      <div class="gctc-form-group">
        <label>Nama</label>
        <input type="text" placeholder="Masukkan nama Anda" required>
      </div>

      <div class="gctc-form-group">
        <label>Email</label>
        <input type="email" placeholder="Masukkan email Anda" required>
      </div>

      <div class="gctc-form-group">
        <label>Pesan / Feedback</label>
        <textarea rows="5" placeholder="Tulis feedback Anda..." required></textarea>
      </div>

      <button type="submit" class="gctc-submit-btn">Kirim Feedback</button>

    </form>

  </div>
</section>

<!-- FOOTER -->
<footer>
  <p>© 2026 Green Mangrove Nusantara Library | Designed by Salwa</p>
</footer>

</body>
</html>
